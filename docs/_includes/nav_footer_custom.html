     components/sidebar.html (desktop) and components/footer.html (mobile) print
     as the *else* branch of `{% if nav_footer_custom != "" %}`.

     capture "" and prints the attribution, which is the opposite of how the
     sibling footer_custom.html hook behaves. A comment satisfies both. -->
