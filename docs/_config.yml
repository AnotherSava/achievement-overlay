title: Achievement Overlay
description: Steam-style achievement popups for games running in the Goldberg Steam Emulator.
# Pinned: an unpinned remote_theme resolves to the theme's default branch HEAD on every
# rebuild, so an upstream commit changes this site with nothing changing here. Bump this
# deliberately, like any other dependency.
remote_theme: just-the-docs/just-the-docs@v0.12.0
baseurl: /achievement-overlay
plugins:
  - jekyll-remote-theme
color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub:
    - https://github.com/AnotherSava/achievement-overlay

exclude:
  - plans/
  - screenshots/capture/
  - screenshots/screenshots.json
